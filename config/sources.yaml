  - id: solar-impulse
    name: Solar Impulse Foundation / Solutions Explorer
    category: general-innovation
    description: "PARTIAL: the public sitemap listed about 100 English solution URLs when checked, which may be less than the historic labelled catalogue. Sample then checkpointed backfill. No full HTML stored."
    homepage: https://impulse-foundation.com/
    collection_url: https://impulse-foundation.com/solutions/solutions-explorer/portfolio
    enabled: true
    status: PARTIAL
    resource_types:
      - SOLUTION
      - TECHNOLOGY
      - ORGANISATION
    update_class: WEEKLY
    adapter: solar-impulse
    access:
      class: PUBLIC
      status: OPEN
      robots_checked: true
      terms_checked: false
    discovery:
      preferred_method: sitemap
      sitemap: https://impulse-foundation.com/sitemap.xml
      rss: null
      notes: https://solarimpulse.com/ redirects to impulse-foundation.com. English solution URLs are listed in sitemap.xml under /solutions/solutions-explorer/portfolio/solutions/. Item pages are server-rendered Angular with an ng-state JSON payload. robots.txt allows the catalogue.
    limits:
      requests_per_minute: 20
      concurrency: 1
    coverage:
      historical_backfill: checkpointed
      notes: "PARTIAL: the public sitemap listed about 100 English solution URLs when checked, which may be less than the historic labelled catalogue. Sample then checkpointed backfill. No full HTML stored."
  - id: springwise
    name: Springwise
    category: general-innovation
    description: "PARTIAL: titles and URLs from public listing cards only. Article bodies are not fetched when the origin returns 403. No collection URL is stored because the database path was not readable."
    homepage: https://springwise.com/
    collection_url: null
    enabled: true
    status: PARTIAL
    resource_types:
      - SOLUTION
      - CASE_STUDY
    update_class: WEEKLY
    adapter: springwise
    access:
      class: PUBLIC
      status: LISTING_ONLY
      robots_checked: true
      terms_checked: false
    discovery:
      preferred_method: html
      sitemap: null
      rss: https://springwise.com/feed/
      notes: Homepage and top-level /category/ pages (200) expose .tile-post listing cards. The public RSS feed at /feed/ is used when it returns 200. Article bodies are still fetched only when the origin allows; otherwise listing card metadata is stored. Sitemaps are often blocked by Cloudflare and are not used.
    limits:
      requests_per_minute: 6
      concurrency: 1
    coverage:
      historical_backfill: not-attempted
      notes: "PARTIAL: titles and URLs from homepage, category listings, and RSS when available. Article bodies are not fetched when the origin returns 403."
