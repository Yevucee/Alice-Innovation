# alice-mcp. Always-on Streamable HTTP service.
# Create a second Railway service from railway.ingestor.toml for the cron.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:mcp"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
